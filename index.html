<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./scss/main.css">
    <title>That's Wizard</title>
</head>
<body>

    <h1>That's Wizard</h1>

    <div class="tracker">
        <div class="tracker__stamina">
            <h3>Stamina</h3>
            <div class="tracker__stamina-track">
                <div class="node node--red node--right node--first">
                    <div class="line line--red line--down-left"></div>
                    <span class="node__number node__number--right">20</span>
                </div>
                <div class="node node--red node--left">
                    <div class="line line--red line--down-right"></div>
                    <span class="node__number node__number--left">19</span>
                </div>
                <div class="node node--red node--right">
                    <div class="line line--red line--down-left"></div>
                    <span class="node__number node__number--right">18</span>
                </div>
                <div class="node node--red node--left">
                    <div class="line line--red line--down-right"></div>
                    <span class="node__number node__number--left">17</span>
                </div>
                <div class="node node--red node--right">
                    <div class="line line--red line--down-left"></div>
                    <span class="node__number node__number--right">16</span>
                </div>
                <div class="node node--red node--left">
                    <div class="line line--red line--down-right"></div>
                    <span class="node__number node__number--left">15</span>
                </div>
                <div class="node node--red node--right">
                    <div class="line line--red line--down-left"></div>
                    <span class="node__number node__number--right">14</span>
                </div>
                <div class="node node--red node--left">
                    <div class="line line--red line--down-right"></div>
                    <span class="node__number node__number--left">13</span>
                </div>
                <div class="node node--red node--right">
                    <div class="line line--red line--down-left"></div>
                    <span class="node__number node__number--right">12</span>
                </div>
                <div class="node node--red node--left">
                    <div class="line line--red line--down-right"></div>
                    <span class="node__number node__number--left">11</span>
                </div>
                <div class="node node--red node--right node--filled-red">
                    <div class="line line--red line--down-left"></div>
                    <span class="node__number node__number--right">10</span>
                </div>
                <div class="node node--red node--left">
                    <div class="line line--red line--down-right"></div>
                    <span class="node__number node__number--left">9</span>
                </div>
                <div class="node node--red node--right">
                    <div class="line line--red line--down-left"></div>
                    <span class="node__number node__number--right">8</span>
                </div>
                <div class="node node--red node--left">
                    <div class="line line--red line--down-right"></div>
                    <span class="node__number node__number--left">7</span>
                </div>
                <div class="node node--red node--right">
                    <div class="line line--red line--down-left"></div>
                    <span class="node__number node__number--right">6</span>
                </div>
                <div class="node node--red node--left">
                    <div class="line line--red line--down-right"></div>
                    <span class="node__number node__number--left">5</span>
                </div>
                <div class="node node--red node--right">
                    <div class="line line--red line--down-left"></div>
                    <span class="node__number node__number--right">4</span>
                </div>
                <div class="node node--red node--left">
                    <div class="line line--red line--down-right"></div>
                    <span class="node__number node__number--left">3</span>
                </div>
                <div class="node node--red node--right">
                    <div class="line line--red line--down-left"></div>
                    <span class="node__number node__number--right">2</span>
                </div>
                <div class="node node--red node--left">
                    <div class="line line--red line--down-right"></div>
                    <span class="node__number node__number--left">1</span>
                </div>
                <div class="node node--red node--right">
                    <span class="node__number node__number--right">0</span>
                </div>
            </div>
        </div>
        <div class="tracker__power">
            <h3>Power</h3>
            <div class="tracker__stamina-track">
                <div class="node node--blue node--center">
                    <span class="node__number node__number--right">10</span>
                </div>
                <div class="line line--blue"></div>
                <div class="node node--blue node--center">
                    <span class="node__number node__number--right">9</span>
                </div>
                <div class="line line--blue"></div>
                <div class="node node--blue node--center">
                    <span class="node__number node__number--right">8</span>
                </div>
                <div class="line line--blue"></div>
                <div class="node node--blue node--center">
                    <span class="node__number node__number--right">7</span>
                </div>
                <div class="line line--blue"></div>
                <div class="node node--blue node--center">
                    <span class="node__number node__number--right">6</span>
                </div>
                <div class="line line--blue"></div>
                <div class="node node--blue node--center">
                    <span class="node__number node__number--right">5</span>
                </div>
                <div class="line line--blue"></div>
                <div class="node node--blue node--center">
                    <span class="node__number node__number--right">4</span>
                </div>
                <div class="line line--blue"></div>
                <div class="node node--blue node--center">
                    <span class="node__number node__number--right">3</span>
                </div>
                <div class="line line--blue"></div>
                <div class="node node--blue node--center node--filled-blue">
                    <span class="node__number node__number--right">2</span>
                </div>
                <div class="line line--blue"></div>
                <div class="node node--blue node--center">
                    <span class="node__number node__number--right">1</span>
                </div>
                <div class="line line--blue"></div>
                <div class="node node--blue node--center">
                    <span class="node__number node__number--right">0</span>
                </div>
            </div>
        </div>
    </div>

    <hr>

    <p>Human Stats</p>
    <div>Stamina: <span class="js_human-stamina">20</span>/20</div>
    <div>Power: <span class="js_human-power">10</span>/10</div>
    <p>Computer Stats</p>
    <div>Stamina: <span class="js_computer-stamina">20</span>/20</div>
    <div>Power: <span class="js_computer-power">10</span>/10</div>

    <hr>

    <div class="js_hand-of-cards hand-of-cards"></div>

    <label for="power">Power:</label>
    <select class="js_power-dropdown" id="power" name="power">
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
        <option value="5">5</option>
        <option value="6">6</option>
        <option value="7">7</option>
        <option value="8">8</option>
        <option value="9">9</option>
        <option value="10">10</option>
    </select>

    <script type="module" src="./script.js"></script>
</body>
</html>
